<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业分布地图</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>body{margin:0;font:14px system-ui;color:#17243a}#map{height:100vh}.panel{position:absolute;left:12px;top:12px;background:#fffffff2;padding:15px;border-radius:12px;max-width:245px;box-shadow:0 3px 20px #0002;z-index:2}h1{font-size:18px;margin:0 0 10px}button{padding:8px;margin:3px;border:1px solid #ccc;border-radius:5px;background:white;cursor:pointer}#status{font-size:12px;color:#555}.maplibregl-popup-content{max-height:280px;overflow:auto;min-width:230px}.company{padding:10px 0;border-bottom:1px solid #ddd}.company div{color:#64748b;font-size:12px;margin-top:6px}#mode button.active{background:#17243a;color:white;border-color:#17243a}.bubble{margin:0;padding:0;border:2px solid #fff;border-radius:50%;color:white;font-weight:700;box-shadow:0 2px 8px #17243a30;opacity:.92;transition:box-shadow .15s}.bubble:hover{box-shadow:0 0 0 4px #ffffff80,0 3px 12px #17243a50;opacity:1}.legend-title{font-size:12px;font-weight:600;margin:12px 0 8px}.legend-items{display:flex;gap:10px;font-size:11px}.legend-items i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}#legend small{display:block;font-size:11px;color:#64748b;margin-top:8px}button:disabled{opacity:.45;cursor:default}</style>
<div id="map"></div><section class="panel"><h1 id="title"></h1><div id="mode"><button id="heat">热力</button><button id="points">集聚气泡</button><button id="reset">查看整个范围</button></div><p>蓝线内为目标区域，范围外灰化。放大查看道路和建筑，点击企业查看注册地址。</p><div id="legend" hidden><div class="legend-title">气泡内数字 = 企业数量</div><div class="legend-items"><span><i style="background:#0d9488"></i>1–4</span><span><i style="background:#2563eb"></i>5–19</span><span><i style="background:#7c3aed"></i>20–49</span><span><i style="background:#ea580c"></i>50+</span></div><small>按当前缩放合并附近企业；放大查看细节</small></div><p id="status">地图加载中，需要联网</p></section>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script>
const P=__PAYLOAD__;document.getElementById('title').textContent=P.title;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[113.94,22.54],zoom:12});map.addControl(new maplibregl.NavigationControl());
function extent(g){const pts=[];function walk(c){if(typeof c[0]==='number')pts.push(c);else c.forEach(walk)}g.features.forEach(f=>walk(f.geometry.coordinates));return [[Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1]))],[Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]]}
// 用世界外框减去目标行政区，范围外灰化；保留目标面内部孔洞。
function outsideMask(g){let holes=[],islands=[];for(const f of g.features){const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;for(const poly of polys){holes.push(poly[0]);for(const h of poly.slice(1))islands.push([h])}}return {type:'Feature',properties:{},geometry:{type:'MultiPolygon',coordinates:[[[[-180,-80],[180,-80],[180,80],[-180,80],[-180,-80]],...holes],...islands]}}}
function inRing(p,r){let yes=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes}
function inTarget(p){return P.boundary.features.some(f=>(f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates).some(poly=>inRing(p,poly[0])&&!poly.slice(1).some(h=>inRing(p,h))))}
const bounds=extent(P.boundary);function resetView(animate=true){if(!map.getSource("boundary"))return;map.fitBounds(bounds,{padding:{top:45,bottom:45,left:Math.min(300,map.getContainer().clientWidth*.42),right:45},bearing:0,pitch:0,retainPadding:false,duration:animate?500:0});} function updateReset(){const b=document.getElementById('reset');const c=map.cameraForBounds(bounds,{padding:{top:45,bottom:45,left:Math.min(300,map.getContainer().clientWidth*.42),right:45},bearing:0,pitch:0});if(!c)return;const p=map.getCenter();const full=Math.abs(map.getZoom()-c.zoom)<.02&&Math.abs(p.lng-c.center.lng)<.0001&&Math.abs(p.lat-c.center.lat)<.0001;b.disabled=full;b.title=full?'已经显示整个范围':'恢复整个范围';}
function popup(list,lnglat){let box=document.createElement('div'),page=0;function draw(){box.replaceChildren();list.slice(page*20,page*20+20).forEach(f=>{let row=document.createElement('div');row.className='company';let b=document.createElement('b');b.textContent=f.properties.name;let d=document.createElement('div');d.textContent='Techin 注册地址：'+f.properties.address;row.append(b,d);box.append(row)});if(list.length>20){let next=document.createElement('button');next.textContent=`下一页（${page+1}/${Math.ceil(list.length/20)}）`;next.onclick=()=>{page=(page+1)%Math.ceil(list.length/20);draw()};box.append(next)}}draw();new maplibregl.Popup({maxWidth:'340px'}).setLngLat(lnglat).setDOMContent(box).addTo(map)}
map.on('load',()=>{map.addSource('boundary',{type:'geojson',data:P.boundary});map.addLayer({id:'outline',type:'line',source:'boundary',paint:{'line-color':'#2563eb','line-width':2}});map.addSource('companies',{type:'geojson',data:P.points});map.addSource('all',{type:'geojson',data:{type:'FeatureCollection',features:P.points.features.filter(f=>inTarget(f.geometry.coordinates))}});map.addLayer({id:'heatmap',type:'heatmap',source:'all',paint:{'heatmap-radius':['interpolate',['linear'],['zoom'],10,12,17,28],'heatmap-opacity':.65}});map.addLayer({id:'clusters',type:'circle',source:'companies',filter:['has','point_count'],layout:{visibility:'visible'},paint:{'circle-color':'#4f46e5','circle-radius':['step',['get','point_count'],18,20,24,100,30],'circle-opacity':.85}});map.addLayer({id:'counts',type:'symbol',source:'companies',filter:['has','point_count'],layout:{visibility:'visible','text-field':['get','point_count_abbreviated'],'text-size':12},paint:{'text-color':'white'}});map.addLayer({id:'dots',type:'circle',source:'companies',filter:['!',['has','point_count']],layout:{visibility:'visible'},paint:{'circle-color':'#059669','circle-radius':6,'circle-stroke-color':'white','circle-stroke-width':2}});map.addSource('outside',{type:'geojson',data:outsideMask(P.boundary)});map.addLayer({id:'outside-gray',type:'fill',source:'outside',paint:{'fill-color':'#e2e8f0','fill-opacity':0.48}});map.moveLayer('outline');resetView(false);setView(true);updateReset();document.getElementById('status').hidden=true;});
let currentHeat=true,markers=[];function setView(heat){currentHeat=heat;map.setLayoutProperty('heatmap','visibility',heat?'visible':'none');['clusters','counts','dots'].forEach(id=>map.setLayoutProperty(id,'visibility','none'));document.getElementById('legend').hidden=heat;document.getElementById('heat').classList.toggle('active',heat);document.getElementById('points').classList.toggle('active',!heat);document.getElementById('status').hidden=true;regroup();map.triggerRepaint()}
document.getElementById('heat').onclick=()=>setView(true);document.getElementById('points').onclick=()=>setView(false);document.getElementById('reset').onclick=()=>resetView(true);
// 先分组，再合并相邻气泡，避免网格边缘把靠近的企业拆成拥挤小点。
function diameter(n){return Math.min(86,22+Math.sqrt(n)*3.5)}
function color(n){return n>=50?'#ea580c':n>=20?'#7c3aed':n>=5?'#2563eb':'#0d9488'}
function regroup(){
 markers.forEach(m=>m.remove());markers=[];if(currentHeat)return;
 const cells={};
 for(const f of P.points.features){if(!inTarget(f.geometry.coordinates))continue;const p=map.project(f.geometry.coordinates);const k=Math.floor(p.x/64)+','+Math.floor(p.y/64);(cells[k]||(cells[k]=[])).push(f)}
 let groups=Object.values(cells).map(list=>({list,c:center(list)}));
 function center(list){let x=0,y=0;for(const f of list){const p=map.project(f.geometry.coordinates);x+=p.x;y+=p.y}return {x:x/list.length,y:y/list.length}}
 // 每次合并都重新计算中心，直到气泡之间留有间距；缩放后重新计算。
 let changed=true;
 while(changed){changed=false;outer:for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
  const a=groups[i],b=groups[j],gap=Math.max(64,(diameter(a.list.length)+diameter(b.list.length))/2+10);
  if(Math.hypot(a.c.x-b.c.x,a.c.y-b.c.y)<gap){a.list.push(...b.list);a.c=center(a.list);groups.splice(j,1);changed=true;break outer}
 }}
 for(const g of groups){const list=g.list,n=list.length,c=map.unproject([g.c.x,g.c.y]);let el=document.createElement('button');el.className='bubble';el.textContent=n;el.style.background=color(n);el.style.width=el.style.height=diameter(n)+'px';el.title=n+'家企业，点击查看';el.setAttribute('aria-label',n+'家企业');el.onclick=e=>{e.stopPropagation();popup(list,c)};markers.push(new maplibregl.Marker({element:el}).setLngLat(c).addTo(map))}
}
map.on('moveend',()=>{regroup();updateReset()});map.on('load',regroup);
map.on('error',()=>{const s=document.getElementById('status');s.hidden=false;s.textContent='地图加载失败，请检查网络';});
</script></html>
